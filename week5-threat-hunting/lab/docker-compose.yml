# Minimal ELK lab for the week 5 hunts.
# Security is OFF on purpose: this is a local, single-user lab on localhost.
# Never expose these ports outside your machine.
#
#   docker compose up -d        # first start: ~1-2 min
#   curl http://localhost:9200  # Elasticsearch is up
#   open http://localhost:5601  # Kibana

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.19.0}
    container_name: hunt-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.19.0}
    container_name: hunt-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata:
